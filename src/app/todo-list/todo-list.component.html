<!-- Forma @for --><!-- <p>Todo-list works!</p> -->
<h2>Lista de Tareas</h2>
<h2>Mis Tareas</h2>
<!-- Formulario para agregar tareas -->
<div class="input-container">
    <input type="text" [(ngModel)]="newTask" placeholder="Nueva tarea" (keyup.enter)="addTask()">
    <button (click)="addTask()">Agregar</button>
</div>

<!-- Lista de tareas con botones de eliminar -->
<ul class="task-list">
    @for (task of tasks; track $index; let i = $index) {
    <li>
        <span>{{ task }}</span>
        <button (click)="removeTask(i)" class="delete-btn">Eliminar</button>
    </li>
    }
</ul>
